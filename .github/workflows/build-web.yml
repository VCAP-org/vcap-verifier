name: build-web
# The one build of the page that everything else consumes. Two jobs build the
# same commit from two clean checkouts on two runners; a third diffs the two
# `dist/` trees byte for byte and, only when they are identical, publishes one
# of them as the `web-dist` artifact. The offline test and the Pages mirror
# both take that artifact — the page that goes live is the page whose hashes
# were reproduced, not a third build that is hoped to match.
on:
  workflow_call:

jobs:
  build:
    name: build web (clean checkout ${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # No npm cache on purpose: the two builds share nothing but the commit
      # and the lockfile, which is what an independent party has too.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build --workspace web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ matrix.run }}
          path: web/dist
          if-no-files-found: error

  reproducible:
    name: two clean builds, one set of hashes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-1
          path: first
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-2
          path: second
      - name: the two builds must be byte-identical
        run: |
          diff -r first second
          echo "reproduced: two clean checkouts, identical dist/"
          cat first/HASHES.md
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: first
          if-no-files-found: error

  # The signature over the manifest, exercised end to end — with a key made in
  # the runner and thrown away, never the real one, which lives in Ops/ on one
  # machine and has no business on a CI runner. What this gates is that the
  # scripts that publish still work and that the published log still verifies
  # against the published key; the real signature is produced by hand, at
  # publish time, from a clean checkout (signing/README.md).
  signature:
    name: sign and verify a manifest, with a throwaway key
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # Every file the manifest names, rehashed from the tree CI reproduced.
      - run: node bin/verify-build.mjs web/dist
      - name: round trip
        run: |
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/key.pem"
          openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -out "$RUNNER_TEMP/key.pub"
          node bin/sign-build.mjs --dist web/dist --key "$RUNNER_TEMP/key.pem" \
            --public-key "$RUNNER_TEMP/key.pub" --log-file "$RUNNER_TEMP/log.jsonl"
          node bin/verify-build.mjs web/dist --public-key "$RUNNER_TEMP/key.pub" --log-file "$RUNNER_TEMP/log.jsonl"
          node bin/verify-build.mjs --log --public-key "$RUNNER_TEMP/key.pub" --log-file "$RUNNER_TEMP/log.jsonl"
      # The mirror's half of the same path: the signature is not made again, it
      # is restored from the log the key holder published. Gated here because
      # `pages-mirror.yml` depends on it and runs by hand, rarely.
      - name: a mirror restores the published signature, and refuses what was never signed
        run: |
          rm web/dist/hashes.json.sig
          node bin/mirror-signature.mjs --dist web/dist --log-file "$RUNNER_TEMP/log.jsonl"
          node bin/verify-build.mjs web/dist --public-key "$RUNNER_TEMP/key.pub" --log-file "$RUNNER_TEMP/log.jsonl"
          # An empty log has no entry for this manifest: the mirror must stop
          # rather than publish an unsigned copy of a signed page.
          : > "$RUNNER_TEMP/empty.jsonl"
          ! node bin/mirror-signature.mjs --dist web/dist --log-file "$RUNNER_TEMP/empty.jsonl"
      # A tampered manifest must fail, or the check above proves nothing.
      - name: a changed manifest must not verify
        run: |
          printf '\n' >> web/dist/hashes.json
          ! node bin/verify-build.mjs web/dist --public-key "$RUNNER_TEMP/key.pub" --log-file "$RUNNER_TEMP/log.jsonl"
      # The signatures this repository actually publishes, against the key it
      # publishes. Empty until the first hand-publish, and it says so.
      - run: node bin/verify-build.mjs --log
