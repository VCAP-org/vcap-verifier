name: ci
on: [push, pull_request]
jobs:
  core:
    name: verification core against the vcap-spec vectors
    runs-on: ubuntu-latest
    steps:
      # vcap-spec is public (D4, MIT): the submodule clones with the default
      # token, the vectors run from it, and the committed snapshot is checked
      # against it so a stale copy fails here.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run vectors:check --workspace core
      - run: npm run typecheck
      - run: npm test
      # The package as a consumer gets it: built to `dist` with declarations,
      # and imported from plain Node. The tests alias to `src`, so without this
      # step a broken build would ship unnoticed.
      - run: npm run build --workspace core
      - run: node -e "import('vcap-verify-core').then(m => { if (typeof m.verify !== 'function') { throw new Error('the built package does not export verify') } })"
      - run: test -f core/dist/index.d.ts
      # The CLI's own tests run it in-process, so the shim and the exit code
      # are only exercised by actually invoking it. `!` because a tampered file
      # must exit non-zero: the run succeeds, the file fails.
      - run: npx tsx cli/src/cli.ts core/vectors/01-jpeg-sealed/input.jpg
      - run: "! npx tsx cli/src/cli.ts core/vectors/11-jpeg-pixels-edited/input.jpg"

  # The page: built twice from clean checkouts, identical or red (build-web.yml).
  web:
    uses: ./.github/workflows/build-web.yml

  # Offline use, proved on the artifact that ships: the page is loaded once,
  # its static server is stopped and the browser taken offline, and the
  # vectors still verify from the service worker's cache.
  offline:
    name: offline use against the built page (${{ matrix.shape }})
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary: served at the root, cross-origin isolated, as
          # vcap-platform's nginx serves it.
          - shape: primary host
            base: /
            isolation: 'on'
          # The GitHub Pages mirror: a sub-path, and no COOP/COEP — a host whose
          # headers are not ours to set. The page loses WASM threads there and
          # nothing else, and that is checked here rather than asserted in a
          # README (D30: "anybody can host it" stays proved).
          - shape: mirror shape, sub-path and no COOP/COEP
            base: /vcap-verifier/
            isolation: 'off'
    env:
      VCAP_TEST_BASE: ${{ matrix.base }}
      VCAP_TEST_ISOLATION: ${{ matrix.isolation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace web
