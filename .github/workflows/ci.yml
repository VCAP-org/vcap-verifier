name: ci
on: [push, pull_request]
jobs:
  core:
    name: verification core against the vcap-spec vectors
    runs-on: ubuntu-latest
    steps:
      # vcap-spec is public (D4, MIT): the submodule clones with the default
      # token, the vectors run from it, and the committed snapshot is checked
      # against it so a stale copy fails here.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run vectors:check --workspace core
      - run: npm run typecheck
      - run: npm test
      # The package as a consumer gets it: built to `dist` with declarations,
      # and imported from plain Node. The tests alias to `src`, so without this
      # step a broken build would ship unnoticed.
      - run: npm run build --workspace core
      - run: node -e "import('vcap-verify-core').then(m => { if (typeof m.verify !== 'function') { throw new Error('the built package does not export verify') } })"
      - run: test -f core/dist/index.d.ts
      # The CLI's own tests run it in-process, so the shim and the exit code
      # are only exercised by actually invoking it. `!` because a tampered file
      # must exit non-zero: the run succeeds, the file fails.
      - run: npx tsx cli/src/cli.ts core/vectors/01-jpeg-sealed/input.jpg
      - run: "! npx tsx cli/src/cli.ts core/vectors/11-jpeg-pixels-edited/input.jpg"
      # The page: one bundle, its hash printed so a verdict can name its verifier.
      - run: npm run build --workspace web
      - run: test -s web/dist/verifier.js && cat web/dist/verifier.js.sha256
