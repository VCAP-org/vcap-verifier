name: ci
on: [push, pull_request]
jobs:
  core:
    name: verification core against the vcap-spec vectors
    runs-on: ubuntu-latest
    steps:
      # vcap-spec is public (D4, MIT): the submodule clones with the default
      # token, the vectors run from it, and the committed snapshot is checked
      # against it so a stale copy fails here.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run vectors:check --workspace core
      - run: npm run typecheck
      - run: npm test
      # The page: one bundle, its hash printed so a verdict can name its verifier.
      - run: npm run build --workspace web
      - run: test -s web/dist/verifier.js && cat web/dist/verifier.js.sha256
