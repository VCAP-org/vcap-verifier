name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy token only needs to publish the artifact; nothing here writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a running one finishes so the page never ends up half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate: the page never deploys over a red core.
  gate:
    name: typecheck and core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The build: twice, from clean checkouts, published only if identical.
  web:
    uses: ./.github/workflows/build-web.yml

  deploy:
    name: publish the verifier page
    needs: [gate, web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The artifact is `web/dist` exactly as the reproducibility job hashed it:
      # the page, the bundle, `hashes.json` and `HASHES.md`. Static only,
      # nothing fetched from our infrastructure.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - run: cat dist/HASHES.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
